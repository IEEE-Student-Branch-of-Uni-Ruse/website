version: 2
multi-ecosystem-groups:
  quarterly-dependencies:
    schedule:
      interval: quarterly
      time: '09:00'
      timezone: Europe/Sofia
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: quarterly-dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: quarterly-dependencies
