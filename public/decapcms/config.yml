            {
              "label": "Blog heading",
              "name": "blogTitle",
              "widget": "string"
            },
            {
              "label": "Stats",
              "name": "stats",
              "widget": "list",
              "summary": "{{fields.title}}",
              "fields": [
                {
                  "label": "Title",
                  "name": "title",
                  "widget": "string"
                },
                {
                  "label": "Amount",
                  "name": "amount",
                  "widget": "string"
                }
              ]
            }
          ]
        },
