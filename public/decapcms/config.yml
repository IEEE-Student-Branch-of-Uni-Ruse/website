                {
                  "label": "Image path",
                  "name": "src",
                  "widget": "image"
                },
                {
                  "label": "Alternative text",
                  "name": "alt",
                  "widget": "string"
                }
              ]
            },
            {
              "label": "Mission",
              "name": "mission",
              "widget": "object",
              "fields": [
                {
                  "label": "Label",
                  "name": "label",
                  "widget": "string"
