{
  "backend": {
    "name": "git-gateway",
    "branch": "main"
  },
  "media_folder": "public/uploads",
  "public_folder": "/uploads",
  "collections": [
    {
      "name": "post",
      "label": "Posts",
      "folder": "src/content/post",
      "create": true,
      "fields": [
        {
          "label": "Title",
          "name": "title",
          "widget": "string"
        },
        {
          "label": "Excerpt",
          "name": "excerpt",
          "widget": "text",
          "required": false
        },
        {
          "label": "Category",
          "name": "category",
          "widget": "string",
          "required": false
        },
        {
          "label": "Tags",
          "name": "tags",
          "widget": "list",
          "required": false
        },
        {
          "label": "Image",
          "name": "image",
          "widget": "image",
          "required": false
        },
        {
          "label": "Publish date",
          "name": "publishDate",
          "widget": "datetime",
          "required": false
        },
        {
          "label": "Author",
          "name": "author",
          "widget": "string",
          "required": false
        },
        {
          "label": "Draft",
          "name": "draft",
          "widget": "boolean",
          "default": false,
          "required": false
        },
        {
          "label": "Content",
          "name": "body",
          "widget": "markdown"
        }
      ]
    },
    {
      "name": "pages",
      "label": "Site content",
